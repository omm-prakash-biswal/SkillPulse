{% extends 'base.html' %}

{% block title %}Reset Password — SkillPulse{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; background-color: var(--color-parchment);">
  <div style="max-width: 440px; width: 100%;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; background: linear-gradient(135deg, var(--color-deep-indigo), var(--color-indigo-blue)); border-radius: var(--radius-lg); color: white; margin-bottom: 0.85rem;">
        <i data-lucide="lock" style="width: 28px; height: 28px;"></i>
      </div>
      <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--color-deep-indigo);">Recover Account</h1>
      <p style="font-size: 0.85rem; color: var(--color-text-muted);">Reset your password using a verified 6-digit email passcode.</p>
    </div>

    <div style="background-color: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 2.25rem 2rem; box-shadow: var(--shadow-md);">
      <form id="forgot-password-form">
        <div class="form-group">
          <label class="form-label" for="reset-email">Registered Email</label>
          <div style="display: flex; gap: 0.5rem;">
            <input type="email" id="reset-email" class="form-control" placeholder="name@example.com" required>
            <button type="button" id="btn-send-otp" class="btn btn-outline" style="white-space: nowrap; font-size: 0.825rem;" data-purpose="password_reset">Send Code</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reset-code">6-Digit Code</label>
          <input type="text" id="reset-code" class="form-control" placeholder="123456" maxlength="6" pattern="[0-9]{6}" required style="letter-spacing: 0.2em; font-family: var(--font-mono);">
        </div>

        <div class="form-group">
          <label class="form-label" for="reset-new-password">New Password</label>
          <input type="password" id="reset-new-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Set New Password</button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem;">
        Remember your password? <a href="/login/" style="color: var(--color-teal); font-weight: 700; text-decoration: none;">Back to Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/auth.js"></script>
{% endblock %}
